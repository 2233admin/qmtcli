[project]
name = "qmtcli"
version = "0.4.0"
description = "AI-native local JSON CLI bridge for QMT/XtQuant market data and guarded stock trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "2233admin" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/2233admin/qmtcli"
Repository = "https://github.com/2233admin/qmtcli"
Issues = "https://github.com/2233admin/qmtcli/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "numpy>=2.4.6", "pandas>=3.0.3"]
sdk = ["xtquant", "pandas", "numpy"]
mcp = ["mcp>=1.0"]

[project.scripts]
qmtcli = "qmtcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmtcli"]

[tool.hatch.build.targets.wheel.force-include]
"src/qmtcli/xtdata_fields.json" = "qmtcli/xtdata_fields.json"

[tool.uv]
# GHSA (CVE-2026): cryptography <50.0.0 has a Bleichenbacher-oracle timing
# side channel in PKCS#7 EnvelopedData decryption. Transitive via pyjwt[crypto];
# qmtcli/pyjwt never touch PKCS#7 envelopes, but pin the floor anyway.
override-dependencies = ["cryptography>=50.0.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so a local run and CI agree: ruff's own default set has grown across
# releases, and an unpinned `ruff check .` reported 266 findings on a clean tree
# while CI installed a different ruff. These four families are the floor; the
# three extras catch bugs this repo has actually shipped.
select = [
    "E4", "E7", "E9", "F",  # import shape, syntax errors, pyflakes
    "PLW1510",  # subprocess.run without an explicit check=
    "RUF059",  # unpacked variable that is never used
    "PLR0124",  # comparison with itself
]

[tool.ruff.format]
# bridge/ is sha256-pinned and deployed byte-identical to two other locations: one
# editor reformat breaks the digest bootstrap.BRIDGE_SHA256 pins and the strategy
# refuses to start. The files are format-clean; this keeps them byte-stable.
exclude = ["bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "mcp>=1.0",
]
