[workspace]
members = ["rust/qmt-quote", "rust/qmt-trade", "rust/qmtcli", "experiments/native-quote-rs"]
default-members = ["rust/qmt-quote", "rust/qmt-trade", "rust/qmtcli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
bson = { version = "=3.1.0", features = ["serde", "serde_json-1"] }
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
qmt-quote = { path = "rust/qmt-quote" }
qmt-trade = { path = "rust/qmt-trade" }
